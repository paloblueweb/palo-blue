  <style>
    :root {
      --bg: #f0f0eb;
      --blue: #022c98;
      --white: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg);
      color: var(--blue);
      font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 56px 16px 52px;
    }

    /* ---------- Logo ---------- */
    .logo { display: block; line-height: 0; }
    .logo-svg { display: block; width: 174px; max-width: 50vw; height: auto; }

    /* ---------- Signup block (Barlow Condensed Regular) ---------- */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 48px 0;
    }
    .signup {
      width: 100%;
      max-width: 337px;
      background: var(--blue);
      color: var(--white);
      font-weight: 400;
      padding: 15px 6px 11px;
      text-align: center;
    }
    .signup p {
      font-size: 13px;
      line-height: 1.3;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      max-width: 210px;
      margin: 0 auto 36px;
    }
    .signup form {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.9);
      padding-bottom: 2px;
    }
    .signup input[type="email"] {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      outline: none;
      color: var(--white);
      font: inherit;
      font-weight: 400;
      font-size: 12px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 2px 0;
    }
    .signup input[type="email"],
    .signup input[type="email"]:focus,
    .signup input[type="email"]:active { color: var(--bg); caret-color: var(--bg); background: transparent; }
    /* Stop the browser's autofill highlight: keep the field blue with cream text */
    .signup input:-webkit-autofill,
    .signup input:-webkit-autofill:hover,
    .signup input:-webkit-autofill:focus,
    .signup input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px var(--blue) inset !important;
      box-shadow: 0 0 0 1000px var(--blue) inset !important;
      -webkit-text-fill-color: var(--bg) !important;
      caret-color: var(--bg);
      transition: background-color 9999s ease-out 0s;
    }
    .signup input:autofill { background: transparent !important; color: var(--bg) !important; }
    .signup input::placeholder { color: rgba(255, 255, 255, 0.6); opacity: 1; }
    .signup button {
      background: none;
      border: 0;
      color: var(--white);
      font: inherit;
      font-weight: 400;
      font-size: 12px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
      padding: 2px 0;
    }
    .signup button:hover { opacity: 0.75; }
    .hp { position: absolute; left: -5000px; } /* Mailchimp anti-bot field: keep hidden */

    /* ---------- Footer (Barlow Condensed Medium) ---------- */
    footer { text-align: center; }
    footer .icon-svg {
      display: block;
      width: 68px;
      height: auto;
      margin: 0 auto 24px;
    }
    footer p {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.16em;
      line-height: 1.3;
      text-transform: uppercase;
    }
  </style>
</head>
